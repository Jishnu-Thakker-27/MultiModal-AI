<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Jarvis animation</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html,body{margin:0;height:100%;background:#020807;overflow:hidden}
  #gl{position:fixed;inset:0;width:100%;height:100%;display:block}
</style>
</head>
<body>
<canvas id="gl" aria-hidden="true"></canvas>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const canvas=document.getElementById('gl');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setClearColor(0x020807,1);
renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(45,1,.1,100);camera.position.z=6;
const root=new THREE.Group();scene.add(root);
const U={uTime:{value:0},uEnergy:{value:.2}};
const ADD=THREE.AdditiveBlending;

/* threads: bundles of fine continuous strands that wave and twist together */
const threadMat=new THREE.ShaderMaterial({
  uniforms:U,transparent:true,depthWrite:false,blending:ADD,
  vertexShader:`
    attribute float aAngle;attribute float aRing;attribute float aRad;attribute vec3 aOff;
    uniform float uTime,uEnergy;varying float vA;varying float vH;
    void main(){
      float t=uTime,th=aAngle,k=aRing;
      float w=sin(th*2.0+t*.5+k*1.7)*.09+sin(th*3.0-t*.35+k*2.9)*.06
             +sin(th*5.0+t*.8+k)*.03*(.5+uEnergy)+sin(th*9.0-t*1.1+k)*.012*uEnergy;
      float tw=sin(th*3.0+t*.7+aOff.y*6.2832)*.5+.5;
      float r=aRad*(1.0+w)+aOff.x*.05*(.5+tw)*(1.0+uEnergy);
      vec3 p=vec3(cos(th)*r,sin(th)*r,0.0);
      p.z=sin(th*3.0+t*.6+k*2.0)*.2*aRad+aOff.z*.06*(.5+tw)+sin(th*2.0-t*.4)*.12;
      gl_Position=projectionMatrix*modelViewMatrix*vec4(p,1.0);
      float pulse=pow(max(0.0,sin(th*2.0-t*(1.2+uEnergy*2.0)+aOff.y*6.2832+k)),18.0);
      vA=.07+.09*(1.0-abs(aOff.x))+pulse*(.55+uEnergy*.45);
      vH=pulse;
    }`,
  fragmentShader:`
    varying float vA;varying float vH;
    void main(){gl_FragColor=vec4(mix(vec3(.16,.80,.70),vec3(.85,1.0,.96),vH),vA);}`
});
const SEG=240,bundles=[[1.9,38],[1.72,38],[1.54,30],[1.36,24],[1.18,18]];
const threads=[];
bundles.forEach(([R,count],ri)=>{
  const V=count*SEG*2;
  const ang=new Float32Array(V),rn=new Float32Array(V),rad=new Float32Array(V),off=new Float32Array(V*3),pos=new Float32Array(V*3);
  let n=0;
  for(let j=0;j<count;j++){
    const ox=Math.random()*2-1,oy=Math.random(),oz=Math.random()*2-1;
    for(let s=0;s<SEG;s++){
      for(let e=0;e<2;e++){
        ang[n]=((s+e)/SEG)*Math.PI*2;rn[n]=ri;rad[n]=R;
        off[n*3]=ox;off[n*3+1]=oy;off[n*3+2]=oz;n++;
      }
    }
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  g.setAttribute('aAngle',new THREE.BufferAttribute(ang,1));
  g.setAttribute('aRing',new THREE.BufferAttribute(rn,1));
  g.setAttribute('aRad',new THREE.BufferAttribute(rad,1));
  g.setAttribute('aOff',new THREE.BufferAttribute(off,3));
  const l=new THREE.LineSegments(g,threadMat);l.frustumCulled=false;
  l.rotation.x=(ri-2)*.03;root.add(l);threads.push(l);
});

/* core: counter-rotating wireframes */
const lineMat=o=>new THREE.LineBasicMaterial({color:0x3fe8d0,transparent:true,opacity:o,blending:ADD,depthWrite:false});
const core=new THREE.Group();root.add(core);
const wireOuter=new THREE.LineSegments(new THREE.WireframeGeometry(new THREE.IcosahedronGeometry(.62,2)),lineMat(.3));
const wireInner=new THREE.LineSegments(new THREE.WireframeGeometry(new THREE.OctahedronGeometry(.32,1)),lineMat(.55));
const vpts=new THREE.Points(new THREE.IcosahedronGeometry(.62,2),new THREE.PointsMaterial({color:0x9fffee,size:.02,transparent:true,opacity:.9,blending:ADD,depthWrite:false}));
const glow=new THREE.Mesh(new THREE.SphereGeometry(.5,24,24),new THREE.MeshBasicMaterial({color:0x3fe8d0,transparent:true,opacity:.07,blending:ADD,depthWrite:false}));
core.add(wireOuter,vpts,glow);
const coreIn=new THREE.Group();coreIn.add(wireInner);root.add(coreIn);

/* fits whatever space the page gives it, centered */
function resize(){
  const w=innerWidth,h=innerHeight;
  renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();
  root.scale.setScalar(.8*Math.min(4.97,4.97*camera.aspect)/4.4);
}
addEventListener('resize',resize);resize();

let mx=0,my=0;
addEventListener('pointermove',e=>{mx=e.clientX/innerWidth-.5;my=e.clientY/innerHeight-.5;});

/* hook for your app: window.setJarvisEnergy(0.2 idle ... 1 thinking) */
let energy=.2,target=.2;
window.setJarvisEnergy=v=>{target=Math.max(0,Math.min(1,v));};

const still=matchMedia('(prefers-reduced-motion:reduce)').matches;
let last=performance.now(),T=0;
function frame(now){
  const dt=Math.min((now-last)/1000,.05);last=now;T+=dt*(still?.15:1);
  energy+=(target-energy)*Math.min(dt*3,1);
  U.uTime.value=T;U.uEnergy.value=energy;
  core.scale.setScalar(1+Math.sin(T*(2+energy*4))*.04*(.4+energy));
  core.rotation.y=T*.25;core.rotation.x=T*.12;
  coreIn.rotation.y=-T*.5;coreIn.rotation.z=T*.3;
  glow.material.opacity=.06+energy*.12;
  wireOuter.material.opacity=.24+energy*.3;
  threads.forEach((l,i)=>{l.rotation.z=T*(.025+i*.01)*(i%2?-1:1)*(1+energy);});
  root.rotation.y+=((mx*.5)-root.rotation.y)*.04;
  root.rotation.x+=((.3+my*.3)-root.rotation.x)*.04;
  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
